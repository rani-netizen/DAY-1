<!DOCTYPE html>
<HEAD>
    <title>Example page</title>

    <link rel="stylesheet" href="style.css">
</HEAD>
<body>
    <h1>HELLO WORLD!!</h1>

        <option value="colorRed">RED</option>
        <option value="colorYellow">Yellow</option>
    </select>

    <label for="breakfast">breakfast</label>
    <input type="radio" name="favmeal" id="lunch" value="meal2">
    <label for="lunch">breakfast</label>

    <input type="checkbox" name="favmeal" id="breakfast" value="meal1">
    <label for="breakfast">breakfast</label>
    <input type="checkbox" name="favmeal" id="lunch" value="meal2">
    <label for="lunch">lunch</label>
